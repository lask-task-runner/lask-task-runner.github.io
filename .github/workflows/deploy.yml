name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sent by the lask repository when its docs or examples change.
  repository_dispatch:
    types: [lask-docs-updated]
  # A fallback in case a dispatch was missed.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out the lask repository
        uses: actions/checkout@v5
        with:
          repository: lask-task-runner/lask
          path: lask-src
          sparse-checkout: |
            README.md
            lask.cabal
            doc
            example

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          LASK_SRC: lask-src

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
