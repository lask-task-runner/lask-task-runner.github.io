name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sent by the lask repository when its docs or examples change.
  repository_dispatch:
    types: [lask-docs-updated]
  # A fallback in case a dispatch was missed.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: an older version of the site is built from a ref of
      # this repository (versions.json).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Full history, tags and branches: each version is built from lask's
      # tag v<version>, or from its development branch until that exists.
      - name: Check out the lask repository
        uses: actions/checkout@v7
        with:
          repository: lask-task-runner/lask
          path: lask-src
          fetch-depth: 0

      # Full history: the module reference is built from the tag that
      # versions.json names for each version.
      - name: Check out the lask-module-tools repository
        uses: actions/checkout@v7
        with:
          repository: lask-task-runner/lask-module-tools
          path: tools-src
          fetch-depth: 0

      # Node and VitePress run in the container main.lask declares, so the
      # runner needs only Lask and Docker. Lask itself also writes the module
      # reference, from its own help.
      - name: Install Lask
        env:
          LASK_VERSION: v0.8.0
          LASK_SHA256: f161676c6313882b7aec1ac79ecde31483c8fdda29f0f867f8daef95f157e3f0
        run: |
          curl -fsSL -o lask.tar.gz \
            "https://github.com/lask-task-runner/lask/releases/download/${LASK_VERSION}/lask-${LASK_VERSION}-linux-amd64.tar.gz"
          echo "${LASK_SHA256}  lask.tar.gz" | sha256sum -c -
          tar -xzf lask.tar.gz
          sudo mv ./lask /usr/local/bin
          rm lask.tar.gz
          lask version

      - run: lask sync --frozen

      - run: lask check

      - run: lask run build --lask-src lask-src --tools-src tools-src

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site-dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
